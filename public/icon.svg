<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Neo-Brutalist Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="#FF5722" stroke="#121212" stroke-width="32" />
  
  <!-- Shadow offset element inside logo for Neo-Brutalist pop -->
  <path d="M 120 140 L 256 340 L 392 140" fill="none" stroke="#121212" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bold Stylized M Wings -->
  <path d="M 100 130 L 170 130 L 256 250 L 342 130 L 412 130 L 412 360 L 342 360 L 342 240 L 256 360 L 170 240 L 170 360 L 100 360 Z" fill="#121212" />

  <!-- Central Shiny Gold Coin sticking out with ฿ symbol -->
  <circle cx="256" cy="210" r="95" fill="#FFD02C" stroke="#121212" stroke-width="24" />
  <circle cx="256" cy="210" r="76" fill="#F59E0B" opacity="0.3" />

  <!-- Thai Baht ฿ Symbol in Center -->
  <text x="256" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="115" fill="#121212">฿</text>
  
  <!-- Bottom Wallet Pocket Cutout -->
  <path d="M 150 310 L 362 310 L 362 340 C 362 390 295 425 256 425 C 217 425 150 390 150 340 Z" fill="#FF5722" stroke="#121212" stroke-width="22" stroke-linejoin="round" />
  
  <!-- Pocket Detail Line -->
  <line x1="180" y1="340" x2="332" y2="340" stroke="#121212" stroke-width="14" stroke-linecap="round" stroke-dasharray="14 10" />
</svg>
